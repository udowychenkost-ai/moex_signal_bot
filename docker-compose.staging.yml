services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moex}
      POSTGRES_USER: ${POSTGRES_USER:-moex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - moex_staging_postgres:/var/lib/postgresql/data

  moex-bot:
    build: .
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-moex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moex}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moex_staging_postgres:
